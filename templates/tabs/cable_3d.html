<div class="row">
    <!-- Left Panel: Input Forms -->
    <div class="col-md-4">
        <div class="scrollable-panel">
            <form id="cable-3d-form">
                <!-- Cable Parameters -->
                <div class="input-group-box">
                    <div class="input-group-title">Cable Parameters</div>

                    <div class="mb-3">
                        <label for="c3d_r_DC" class="form-label">Cable Radius [m]</label>
                        <input type="number" class="form-control" id="c3d_r_DC" name="r_DC"
                               value="0.060" step="0.001" required>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_cable_angle" class="form-label">Cable Angle [deg]</label>
                        <input type="number" class="form-control" id="c3d_cable_angle" name="cable_angle"
                               value="15.119" step="0.001" required>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_cable_slope" class="form-label">Cable Slope [deg]</label>
                        <input type="number" class="form-control" id="c3d_cable_slope" name="cable_slope"
                               value="0" step="0.001" required>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_I_DC" class="form-label">DC Current [A]</label>
                        <input type="number" class="form-control" id="c3d_I_DC" name="I_DC"
                               value="1000" step="10" required>
                    </div>
                </div>

                <!-- Calculation Parameters -->
                <div class="input-group-box">
                    <div class="input-group-title">Calculation Parameters</div>

                    <div class="mb-3">
                        <label for="c3d_step_size" class="form-label">Step Size [m]</label>
                        <input type="number" class="form-control" id="c3d_step_size" name="step_size"
                               value="100" min="10" step="10" required>
                        <small class="text-muted">Distance between calculation points</small>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_cross_radius" class="form-label">Cross-section Radius [m]</label>
                        <input type="number" class="form-control" id="c3d_cross_radius" name="cross_radius"
                               value="2.0" min="0.1" step="0.1" required>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_n_radial" class="form-label">Radial Resolution</label>
                        <input type="number" class="form-control" id="c3d_n_radial" name="n_radial"
                               value="50" min="10" max="200" step="10" required>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_n_angular" class="form-label">Angular Resolution</label>
                        <input type="number" class="form-control" id="c3d_n_angular" name="n_angular"
                               value="36" min="12" max="72" step="12" required>
                    </div>

                    <div class="mb-3">
                        <label for="c3d_date" class="form-label">Date (YYYY-MM-DD)</label>
                        <input type="date" class="form-control" id="c3d_date" name="date" required>
                    </div>
                </div>

                <!-- Route Selection -->
                <div class="input-group-box">
                    <div class="input-group-title">Cable Route</div>

                    <div class="mb-3">
                        <label class="form-label">Selected Route</label>
                        <input type="text" class="form-control" id="c3d_route" readonly
                               style="background-color: #3a3a3a;" value="Draw on map">
                    </div>

                    <button type="button" class="btn btn-outline-info w-100 mb-3" id="c3d-map-btn">
                        📍 Draw Cable Route on Map
                    </button>

                    <input type="hidden" id="c3d_route_data" name="route_data">
                </div>

                <!-- Calculate Button -->
                <button type="submit" class="btn btn-primary w-100" id="c3d-calc-btn">
                    <span class="spinner-border spinner-border-sm d-none" id="c3d-spinner"></span>
                    <span id="c3d-btn-text">Calculate 3D Fields</span>
                </button>

                <!-- Progress Bar -->
                <div class="mt-3" id="c3d-progress-container" style="display: none;">
                    <div class="input-group-box">
                        <div class="input-group-title">Calculation Progress</div>
                        <div class="progress mb-2" style="height: 25px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated"
                                 id="c3d-progress-bar" role="progressbar" style="width: 0%">0%</div>
                        </div>
                        <p class="text-muted small" id="c3d-progress-text">Initializing...</p>
                    </div>
                </div>

                <!-- Export Button -->
                <div class="mt-3">
                    <button type="button" class="btn btn-outline-secondary w-100" id="c3d-export-csv" disabled>
                        Export Data (CSV)
                    </button>
                </div>
            </form>

            <!-- Results Display -->
            <div id="c3d-results" class="mt-3" style="display: none;">
                <div class="input-group-box">
                    <div class="input-group-title">Results</div>
                    <div id="c3d-results-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel: Plots -->
    <div class="col-md-8">
        <div id="c3d-plots">
            <div class="plot-container">
                <div class="plot-placeholder">
                    <i class="bi bi-diagram-3" style="font-size: 48px; color: #14ffec;"></i>
                    <p class="mt-3">Draw cable route on map, then calculate</p>
                    <p class="text-muted">Shows field profile along the route</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Map Modal -->
<div class="modal fade" id="c3d-map-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content" style="background-color: #2d2d30;">
            <div class="modal-header" style="border-bottom: 1px solid #3e3e42;">
                <h5 class="modal-title" style="color: #14ffec;">Draw Cable Route</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" style="height: 70vh;">
                <iframe id="c3d-map-iframe" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #3e3e42;">
                <p class="text-muted me-auto" id="c3d-map-status">Use polyline tool to draw cable route</p>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    // Set today's date
    $('#c3d_date').val(new Date().toISOString().split('T')[0]);

    let routeCoords = null;
    let currentTaskId = null;
    let pollInterval = null;

    // Map button handler
    $('#c3d-map-btn').on('click', function() {
        $('#c3d-map-iframe').attr('src', '/cable-3d/map');
        $('#c3d-map-modal').modal('show');
    });

    // Listen for route drawn from map
    window.addEventListener('message', function(event) {
        if (event.data.type === 'route_drawn') {
            routeCoords = event.data.route.coords;
            $('#c3d_route').val(`Route with ${routeCoords.length} points`);
            $('#c3d_route_data').val(JSON.stringify(routeCoords));
            $('#c3d-map-status').html('<span style="color: #14ffec;">✓ Route selected</span>');
        }
    });

    // Form submission
    $('#cable-3d-form').on('submit', function(e) {
        e.preventDefault();

        if (!routeCoords || routeCoords.length < 2) {
            alert('Please draw a route on the map first (minimum 2 points)');
            return;
        }

        // Get form data
        const formData = {};
        $(this).serializeArray().forEach(item => {
            formData[item.name] = item.value;
        });
        formData.route_coords = routeCoords;

        // Start calculation
        $('#c3d-calc-btn').prop('disabled', true);
        $('#c3d-spinner').removeClass('d-none');
        $('#c3d-btn-text').text('Starting...');
        $('#c3d-progress-container').show();
        $('#c3d-plots').html('<div class="plot-container"><div class="spinner-border"></div><p class="mt-3">Starting 3D cable calculation...</p></div>');

        $.ajax({
            url: '/cable-3d/calculate',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(response) {
                if (response.status === 'success') {
                    currentTaskId = response.task_id;
                    startPolling(currentTaskId);
                } else {
                    alert('Error: ' + response.message);
                    resetUI();
                }
            },
            error: function(xhr) {
                const error = xhr.responseJSON ? xhr.responseJSON.message : 'Unknown error';
                alert('Failed to start calculation: ' + error);
                resetUI();
            }
        });
    });

    function startPolling(taskId) {
        pollInterval = setInterval(function() {
            $.ajax({
                url: '/cable-3d/status/' + taskId,
                method: 'GET',
                success: function(response) {
                    if (response.status === 'pending') {
                        updateProgress(0, 'Task pending...');
                    } else if (response.status === 'progress') {
                        const percent = Math.round((response.current / response.total) * 100);
                        updateProgress(percent, response.message);
                    } else if (response.status === 'success') {
                        clearInterval(pollInterval);
                        displayResults(response.result);
                        resetUI();
                        $('#c3d-export-csv').prop('disabled', false);
                    } else if (response.status === 'error') {
                        clearInterval(pollInterval);
                        alert('Calculation failed: ' + response.message);
                        resetUI();
                    }
                },
                error: function() {
                    clearInterval(pollInterval);
                    alert('Lost connection to server');
                    resetUI();
                }
            });
        }, 1000);
    }

    function updateProgress(percent, message) {
        $('#c3d-progress-bar').css('width', percent + '%').text(percent + '%');
        $('#c3d-progress-text').text(message);
    }

    function displayResults(result) {
        let plotsHTML = '';

        if (result.plots) {
            // Display all plots
            for (let key in result.plots) {
                plotsHTML += `
                    <div class="plot-container mb-3">
                        <h5 class="text-center" style="color: #14ffec;">Field Profile Along Route</h5>
                        <img src="${result.plots[key]}" class="img-fluid" alt="${key}">
                    </div>
                `;
            }
        }

        $('#c3d-plots').html(plotsHTML);

        // Display statistics if available
        if (result.statistics) {
            const stats = result.statistics;
            const resultsHTML = `
                <p><strong>Route Points:</strong> ${stats.n_points}</p>
                <p><strong>Max Cable Field:</strong> ${stats.max_cable_field.toFixed(2)} nT</p>
                <p><strong>Mean Earth Field:</strong> ${stats.mean_earth_field.toFixed(2)} nT</p>
                <p class="text-success"><strong>${result.message}</strong></p>
            `;
            $('#c3d-results-content').html(resultsHTML);
            $('#c3d-results').show();
        }
    }

    function resetUI() {
        $('#c3d-calc-btn').prop('disabled', false);
        $('#c3d-spinner').addClass('d-none');
        $('#c3d-btn-text').text('Calculate 3D Fields');
    }

    // Export handler
    $('#c3d-export-csv').on('click', function() {
        window.location.href = '/cable-3d/export-data';
    });
});
</script>
