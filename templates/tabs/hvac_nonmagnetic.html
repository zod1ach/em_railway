<div class="row">
    <!-- Left Panel: Input Forms -->
    <div class="col-md-4">
        <div class="scrollable-panel">
            <form id="hvac-nonmag-form">
                <!-- Geometry Group -->
                <div class="input-group-box">
                    <div class="input-group-title">Geometry</div>

                    <div class="mb-3">
                        <label for="p_c" class="form-label">Power Core Lay Length [m]</label>
                        <input type="number" class="form-control" id="p_c" name="p_c"
                               value="2.750" step="0.001" required>
                    </div>

                    <div class="mb-3">
                        <label for="R_h" class="form-label">Radius of Helix [m]</label>
                        <input type="number" class="form-control" id="R_h" name="R_h"
                               value="0.060391" step="0.000001" required>
                    </div>

                    <div class="mb-3">
                        <label for="r_AC" class="form-label">Cable Radius [m]</label>
                        <input type="number" class="form-control" id="r_AC" name="r_AC"
                               value="0.1225" step="0.0001" required>
                    </div>

                    <div class="mb-3">
                        <label for="d_s" class="form-label">Sheath Diameter [m]</label>
                        <input type="number" class="form-control" id="d_s" name="d_s"
                               value="0.0958" step="0.0001" required>
                    </div>

                    <div class="mb-3">
                        <label for="s" class="form-label">Distance Between Conductors [m]</label>
                        <input type="number" class="form-control" id="s" name="s"
                               value="0.0892" step="0.0001" required>
                    </div>
                </div>

                <!-- Materials Group -->
                <div class="input-group-box">
                    <div class="input-group-title">Materials</div>

                    <div class="mb-3">
                        <label for="R_s" class="form-label">Sheath Resistance [Ω/m]</label>
                        <input type="number" class="form-control" id="R_s" name="R_s"
                               value="2.39815e-4" step="1e-7" required>
                    </div>
                </div>

                <!-- Electric Parameters Group -->
                <div class="input-group-box">
                    <div class="input-group-title">Electric Parameters</div>

                    <div class="mb-3">
                        <label for="f" class="form-label">Frequency [Hz]</label>
                        <input type="number" class="form-control" id="f" name="f"
                               value="50" step="1" required>
                    </div>

                    <div class="mb-3">
                        <label for="I_AC" class="form-label">AC Current [A]</label>
                        <input type="number" class="form-control" id="I_AC" name="I_AC"
                               value="1000" step="10" required>
                    </div>
                </div>

                <!-- Calculation Parameters Group -->
                <div class="input-group-box">
                    <div class="input-group-title">Calculation Parameters</div>

                    <div class="mb-3">
                        <label for="N_calc" class="form-label">Number of Terms (N_calc)</label>
                        <input type="number" class="form-control" id="N_calc" name="N_calc"
                               value="10" min="1" max="100" step="1" required>
                        <small class="text-muted">Higher values = more accurate but slower</small>
                    </div>
                </div>

                <!-- Calculate Button -->
                <button type="submit" class="btn btn-primary w-100">
                    <span class="spinner-border spinner-border-sm d-none" id="hvac-nonmag-spinner"></span>
                    <span id="hvac-nonmag-btn-text">Calculate Fields</span>
                </button>

                <!-- Export Buttons -->
                <div class="mt-3">
                    <button type="button" class="btn btn-outline-secondary w-100 mb-2" id="hvac-nonmag-export-csv">
                        Export Data (CSV)
                    </button>
                </div>
            </form>

            <!-- Results Display -->
            <div id="hvac-nonmag-results" class="mt-3" style="display: none;">
                <div class="input-group-box">
                    <div class="input-group-title">Results</div>
                    <div id="hvac-nonmag-results-content"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel: Plots -->
    <div class="col-md-8">
        <div id="hvac-nonmag-plots">
            <div class="plot-container">
                <div class="plot-placeholder">
                    <i class="bi bi-graph-up" style="font-size: 48px; color: #14ffec;"></i>
                    <p class="mt-3">Enter parameters and click "Calculate Fields" to generate plots</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#hvac-nonmag-form').on('submit', function(e) {
        e.preventDefault();

        // Show loading
        $('#hvac-nonmag-spinner').removeClass('d-none');
        $('#hvac-nonmag-btn-text').text('Calculating...');
        $('#hvac-nonmag-plots').html('<div class="plot-container"><div class="spinner-border" role="status"></div><p class="mt-3">Calculating fields...</p></div>');

        // Get form data
        const formData = {};
        $(this).serializeArray().forEach(item => {
            formData[item.name] = item.value;
        });

        // Send AJAX request
        $.ajax({
            url: '/hvac-nonmag/calculate',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(response) {
                if (response.status === 'success') {
                    // Display plots
                    let plotsHTML = '';

                    if (response.plots.surface) {
                        plotsHTML += `
                            <div class="plot-container mb-3">
                                <h5 class="text-center" style="color: #14ffec;">Magnetic Field - Surface</h5>
                                <img src="${response.plots.surface}" class="img-fluid" alt="Magnetic Field Surface">
                            </div>
                        `;
                    }

                    if (response.plots.electric) {
                        plotsHTML += `
                            <div class="plot-container mb-3">
                                <h5 class="text-center" style="color: #14ffec;">Electric Field - Surface</h5>
                                <img src="${response.plots.electric}" class="img-fluid" alt="Electric Field Surface">
                            </div>
                        `;
                    }

                    if (response.plots.radial) {
                        plotsHTML += `
                            <div class="plot-container mb-3">
                                <h5 class="text-center" style="color: #14ffec;">Magnetic Field - Radial Profile</h5>
                                <img src="${response.plots.radial}" class="img-fluid" alt="Radial Profile">
                            </div>
                        `;
                    }

                    if (response.plots.azimuthal) {
                        plotsHTML += `
                            <div class="plot-container mb-3">
                                <h5 class="text-center" style="color: #14ffec;">Magnetic Field - Azimuthal Profile</h5>
                                <img src="${response.plots.azimuthal}" class="img-fluid" alt="Azimuthal Profile">
                            </div>
                        `;
                    }

                    $('#hvac-nonmag-plots').html(plotsHTML);

                    // Display results
                    const resultsHTML = `
                        <p><strong>Maximum Field:</strong> ${response.results.max_field.toFixed(4)} µT</p>
                        <p><strong>Minimum Field:</strong> ${response.results.min_field.toFixed(4)} µT</p>
                        <p><strong>Sheath Reduction Factor:</strong> ${response.results.sheath_reduction.toFixed(6)}</p>
                    `;
                    $('#hvac-nonmag-results-content').html(resultsHTML);
                    $('#hvac-nonmag-results').show();
                } else {
                    alert('Error: ' + response.message);
                }
            },
            error: function(xhr) {
                const error = xhr.responseJSON ? xhr.responseJSON.message : 'Unknown error';
                alert('Calculation failed: ' + error);
                $('#hvac-nonmag-plots').html('<div class="plot-container"><p class="text-danger">Calculation failed. Please check your inputs.</p></div>');
            },
            complete: function() {
                // Hide loading
                $('#hvac-nonmag-spinner').addClass('d-none');
                $('#hvac-nonmag-btn-text').text('Calculate Fields');
            }
        });
    });

    // CSV Export Handler
    $('#hvac-nonmag-export-csv').on('click', function() {
        window.location.href = '/hvac-nonmag/export-data';
    });
});
</script>
