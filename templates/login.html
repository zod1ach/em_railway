{% extends "base.html" %}

{% block title %}Login - EM Calculator{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h1 class="login-title">EM CALCULATOR</h1>
        <p class="login-subtitle">Electromagnetic Field Calculator for Subsea Cables</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div class="login-footer mt-4">
            <p class="text-muted small">University of Southampton - EPE Research Group</p>
        </div>
    </div>
</div>

<style>
.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
}

.login-box {
    background-color: #1e1e1e;
    border: 1px solid #404040;
    border-radius: 8px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

.login-title {
    color: #14ffec;
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.login-subtitle {
    color: #b0b0b0;
    font-size: 14px;
    text-align: center;
    margin-bottom: 30px;
}

.login-footer {
    text-align: center;
}
</style>
{% endblock %}
